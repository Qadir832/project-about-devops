
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cloud DevOps Calculator project">
    <title>Cloud Calculator | DevOps Project</title>

    <link rel="stylesheet" href="style.css">
    <script src="file.js" defer></script>
</head>
<body>

    <main class="calculator">
        <header class="header">
            <h1>Cloud Calculator</h1>
            <p>My Cloud &amp; DevOps Project</p>
        </header>

        <output id="display" class="display"
                aria-live="polite" aria-label="Calculator display">0</output>

        <p id="message" class="message" aria-live="polite"></p>

        <section class="buttons" aria-label="Calculator buttons">
            <button type="button" class="utility" data-action="clear">AC</button>
            <button type="button" class="utility" data-action="delete">DEL</button>
            <button type="button" class="operator" data-operator="/">÷</button>
            <button type="button" class="operator" data-operator="*">×</button>

            <button type="button" data-digit="7">7</button>
            <button type="button" data-digit="8">8</button>
            <button type="button" data-digit="9">9</button>
            <button type="button" class="operator" data-operator="-">−</button>

            <button type="button" data-digit="4">4</button>
            <button type="button" data-digit="5">5</button>
            <button type="button" data-digit="6">6</button>
            <button type="button" class="operator" data-operator="+">+</button>

            <button type="button" data-digit="1">1</button>
            <button type="button" data-digit="2">2</button>
            <button type="button" data-digit="3">3</button>
            <button type="button" class="equals" data-action="equals">=</button>

            <button type="button" class="zero" data-digit="0">0</button>
            <button type="button" data-action="decimal">.</button>
        </section>

        <footer class="footer">
            Built with HTML, CSS and JavaScript
        </footer>
    </main>

</body>
</html>
